name: Build DeskLink APK and Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload DeskLink APK
        uses: actions/upload-artifact@v4
        with:
          name: DeskLink-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk

  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build DeskLinkServer.exe
        working-directory: pc_server
        run: python -m PyInstaller --noconfirm --onefile --console --name DeskLinkServer pc_remote_server.py

      - name: Upload DeskLinkServer EXE
        uses: actions/upload-artifact@v4
        with:
          name: DeskLink-Windows-EXE
          path: pc_server/dist/DeskLinkServer.exe
